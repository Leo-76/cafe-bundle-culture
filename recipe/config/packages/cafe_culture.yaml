# Configuration du CafeCultureBundle
# Generee automatiquement par Symfony Flex lors du composer require
# Modifiez ces valeurs selon vos besoins

cafe_culture:
    posts_per_page: 9
    upload_dir: '%kernel.project_dir%/public/uploads/cafe-culture'
    default_locale: 'fr'
    enable_comments: true
    enable_ratings: true
    sitename: 'La Culture du Cafe'
